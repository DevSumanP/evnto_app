# Deploy pipeline (Android). Push a long-lived branch -> build its flavor -> ship it.
#
#   branch    flavor        artifact   destination
#   dev       development   APK        Firebase App Distribution
#   staging   staging       AAB        Play Console (internal track)
#   main      production    AAB        Play Console (production, 10% rollout)
#
# GitHub Secrets are written to on-disk config files by
# scripts/ci_materialize_secrets.sh. See docs/CICD.md for the full secret list.
name: Deploy

on:
  push:
    branches: [dev, staging, main]
  workflow_dispatch:

# One deploy per branch; never cancel mid-upload (a store could be left half-published).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # 3.35.7 resolves the Kotlin plugin to 2.3.x, needed to read the 2.3 bytecode
  # current plugins (google_maps_flutter, ...) ship. 3.35.5 fell back to 2.1.0.
  FLUTTER_VERSION: "3.35.7"

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45 # cold runner downloads NDK/SDK/CMake on first build (~13 min)
    steps:
      - uses: actions/checkout@v5

      # Branch -> flavor, artifact type (apk/appbundle), and Fastlane lane.
      - name: Resolve target
        id: t
        run: |
          case "${{ github.ref_name }}" in
            dev)     flavor=development; artifact=apk;       lane=distribute_dev   ;;
            staging) flavor=staging;     artifact=appbundle; lane=deploy_staging    ;;
            main)    flavor=production;  artifact=appbundle; lane=deploy_production ;;
            *) echo "::error::Branch '${{ github.ref_name }}' has no deploy target."; exit 1 ;;
          esac
          {
            echo "flavor=$flavor"
            echo "artifact=$artifact"
            echo "lane=$lane"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install deps & generate code
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      # Write GitHub Secrets into the config files the build and Fastlane read.
      - name: Materialize secrets
        run: bash scripts/ci_materialize_secrets.sh ${{ steps.t.outputs.flavor }}
        env:
          ENV_DEVELOPMENT: ${{ secrets.ENV_DEVELOPMENT }}
          ENV_STAGING: ${{ secrets.ENV_STAGING }}
          ENV_PRODUCTION: ${{ secrets.ENV_PRODUCTION }}
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      # versionCode = run number (always increasing); versionName from pubspec.
      - name: Build (${{ steps.t.outputs.flavor }})
        run: >
          flutter build ${{ steps.t.outputs.artifact }} --release
          --flavor ${{ steps.t.outputs.flavor }}
          -t lib/main_${{ steps.t.outputs.flavor }}.dart
          --build-number=${{ github.run_number }}
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}

      - name: Set up Ruby + Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: android

      - name: Upload via Fastlane
        working-directory: android
        run: bundle exec fastlane ${{ steps.t.outputs.lane }}
        env:
          FIREBASE_APP_ID_DEV: ${{ secrets.FIREBASE_APP_ID_DEV }}
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS }}
          RELEASE_NOTES: "Build ${{ github.run_number }} (${{ github.sha }})"

      # Keep the signed artifact on the run page. Only one path exists per flavor.
      - name: Archive artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.t.outputs.flavor }}-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-${{ steps.t.outputs.flavor }}-release.apk
            build/app/outputs/bundle/${{ steps.t.outputs.flavor }}Release/app-${{ steps.t.outputs.flavor }}-release.aab
          if-no-files-found: ignore
          retention-days: 14
